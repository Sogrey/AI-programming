<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你画我猜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>你画我猜</h1>
        
        <div class="game-info">
            <div class="word-display">
                <p>要画的词：</p>
                <h2 id="word-to-draw">苹果</h2>
                <h2 id="word-blurred" class="hidden">***</h2>
            </div>
            <div class="guess-section">
                <input type="text" id="guess-input" placeholder="输入你的猜测">
                <button id="guess-btn">提交猜测</button>
                <button id="give-up-btn">太烧脑了，我猜不到</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="drawing-board" width="800" height="500"></canvas>
        </div>
        
        <div class="tools">
            <div class="color-picker">
                <button class="color-btn active" style="background-color: black;" data-color="black"></button>
                <button class="color-btn" style="background-color: red;" data-color="red"></button>
                <button class="color-btn" style="background-color: blue;" data-color="blue"></button>
                <button class="color-btn" style="background-color: green;" data-color="green"></button>
                <button class="color-btn" style="background-color: yellow;" data-color="yellow"></button>
            </div>
            
            <div class="brush-size">
                <label for="brush-slider">画笔大小：</label>
                <input type="range" id="brush-slider" min="1" max="50" value="5">
                <span id="brush-size-value">5</span>
            </div>
            
            <div class="actions">
                <button id="clear-btn">清除画布</button>
                <button id="new-word-btn">换一个词</button>
            </div>
        </div>
        
        <div class="message" id="message"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
